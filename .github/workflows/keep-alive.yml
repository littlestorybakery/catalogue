# 每 3 天自动访问一次 Supabase，避免免费版 7 天没动静就暂停。
# 每个月 1 号也会更新一次 keepalive.txt，避免 GitHub 因为 60 天没活动而停掉这个排程。
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]*' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]*' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js 还没填 Supabase 资料，跳过。"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/rpc/get_catalog" -H "apikey: $KEY")
          echo "Supabase responded: $code"

      - name: Monthly repo activity
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > keepalive.txt
            git config user.name "keepalive-bot"
            git config user.email "actions@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive" && git push || true
          fi
